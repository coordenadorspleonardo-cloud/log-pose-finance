<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Pose</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141B23">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Log Pose">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --serif:'Fraunces',serif; --sans:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  --paper:#EEF1EC; --card:#FFFFFF; --ink:#141B23; --text:#1B2430; --muted:#5B6572;
  --positive:#1F7A5C; --negative:#C1443D; --accent2:#B8963E;
  --line:#5B657233; --onInk:#FFFFFF; --onAccent:#FFFFFF;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);min-height:100vh;}
input,select,textarea,button{font-family:inherit;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
.fin-input:focus{outline:none;background:#1F7A5C22;}
a{color:inherit;}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}
#loginScreen .wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.07;pointer-events:none;z-index:0;}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:360px;position:relative;z-index:1;}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.login-brand h1{font-family:var(--serif);font-size:24px;font-weight:600;margin:0;}
.login-sub{font-size:13px;color:var(--muted);margin:0 0 20px;}
.tabbtns{display:flex;gap:6px;margin-bottom:16px;}
.tabbtn{flex:1;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;text-align:center;}
.tabbtn.active{background:var(--ink);color:var(--onInk);border-color:var(--ink);}
.field{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--paper);color:var(--text);margin-bottom:10px;}
.btn-primary{width:100%;background:var(--positive);color:#fff;border:none;border-radius:8px;padding:11px 14px;font-size:13.5px;font-weight:600;cursor:pointer;}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;cursor:pointer;margin-bottom:16px;}
.divider{display:flex;align-items:center;gap:8px;margin:4px 0 16px;color:var(--muted);font-size:11px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
.err-msg{font-size:12px;color:var(--negative);margin:0 0 10px;word-break:break-word;}
.ok-msg{font-size:12px;color:var(--positive);margin:0 0 10px;}
.link-btn{background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;text-decoration:underline;display:block;margin:12px auto 0;}

/* APP SHELL */
#appScreen{display:none;min-height:100vh;flex-direction:column;}
header{background:var(--ink);color:var(--onInk);padding:20px 32px;position:relative;overflow:hidden;}
header .wm{position:absolute;top:-40px;right:-30px;opacity:.09;pointer-events:none;}
.hd-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:relative;z-index:1;}
.hd-left{display:flex;align-items:center;gap:10px;}
.hd-left h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;}
.hd-left p{font-size:11.5px;color:#ffffffaa;margin:0;}
.hd-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.hd-right select,.hd-right button{background:transparent;color:var(--onInk);border:1px solid #ffffff33;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;}
.hd-right select option{background:#FFFFFF;color:#1B2430;}
nav.tabs{display:flex;gap:6px;padding:12px 32px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--card);}
.tab{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.tab.active{background:var(--ink);color:var(--onInk);border-color:var(--ink);}
main{padding:20px 32px 60px;width:100%;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;}
.card-title{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 0 14px;}
.section-title{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 4px;}
.section-sub{font-size:12px;color:var(--muted);margin:0 0 14px;}

/* TABLE */
table{border-collapse:collapse;width:100%;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:6px 8px;}
td{padding:3px 4px;font-size:12.5px;border-top:1px solid var(--line);}
.mtable-scroll{overflow-x:auto;}
.mtable th:nth-child(1),.mtable td:nth-child(1){position:sticky;left:0;z-index:2;background:var(--card);}
.mtable th:nth-child(2),.mtable td:nth-child(2){position:sticky;left:26px;z-index:2;background:var(--card);box-shadow:2px 0 5px -3px rgba(0,0,0,.25);}
td.num{text-align:right;font-family:var(--mono);}
tfoot td{border-top:2px solid var(--ink);font-weight:700;font-family:var(--mono);}
.cell-input{border:none;background:transparent;width:100%;font-family:inherit;font-size:13px;padding:5px 4px;color:var(--text);}
.cell-input.num{width:58px;text-align:right;font-family:var(--mono);font-size:12.5px;}
.cell-input.wide{min-width:210px;}
.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--muted);display:inline-flex;padding:4px;}
.icon-btn.del{color:var(--negative);}
.icon-btn.rec.on{color:var(--accent2);}
.add-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.add-row input,.add-row select{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;background:var(--card);color:var(--text);min-width:90px;}
.add-row button{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--onInk);border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;}

/* KPI / DASHBOARD */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:14px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.kpi-lbl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-bottom:6px;}
.kpi-val{font-family:var(--mono);font-weight:600;font-size:18px;}
.swatch{position:relative;display:inline-flex;border-radius:50%;cursor:pointer;border:1.5px solid var(--line);overflow:hidden;flex-shrink:0;}
.swatch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-bottom:20px;}
.chart-wrap{height:260px;}
.legend-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:6px;}
.legend-left{display:flex;align-items:center;gap:6px;}
.budget-bar-track{height:6px;background:var(--line);border-radius:999px;overflow:hidden;}
.budget-bar-fill{height:100%;border-radius:999px;}
.group-hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;}
.group-card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;}
.result-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;font-family:var(--mono);}
.result-part span:first-child{font-weight:700;font-size:17px;display:block;}
.result-part span:last-child{color:var(--muted);font-size:11px;font-family:var(--sans);}

/* Aparência panel */
.appearance-btn{position:relative;}
.appearance-panel{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;width:290px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:480px;overflow-y:auto;display:none;color:var(--text);}
.appearance-panel.open{display:block;}
.appearance-panel p.lbl{font-size:12px;color:var(--muted);margin:0 0 10px;}
.preset-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);position:relative;cursor:pointer;margin:0 8px 8px 0;}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:12.5px;}
.style-btn{flex:1;padding:7px 4px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--text);}
.style-btn.active{border-color:var(--positive);background:#1F7A5C18;color:var(--positive);}

/* Navegação Rotina/Finanças */
.toplevel{display:flex;gap:8px;padding:14px 32px 0;}
.toplevel button{flex:0 0 auto;min-width:160px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px 12px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--paper);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;}
.toplevel button.active{background:var(--card);color:var(--text);}
.fin-controls{display:flex;gap:8px;padding:10px 32px;justify-content:flex-end;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line);}
.fin-controls select,.fin-controls button{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--paper);color:var(--text);cursor:pointer;}

/* ROTINA */
.streak-chips{display:flex;flex-wrap:wrap;gap:6px;}
.streak-chip{background:#ffffff1a;border-radius:8px;padding:5px 9px;font-size:11.5px;display:flex;align-items:center;gap:5px;font-family:var(--mono);}
.ghost-row-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--muted);cursor:pointer;}

/* Kanban de tarefas */
.kanban{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.kanban{grid-template-columns:1fr;}}
.kcol-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kcol-hd b{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
.kcount{background:var(--card);border-radius:999px;padding:2px 9px;font-size:10.5px;font-family:var(--mono);color:var(--muted);}
.empty-col{font-size:12px;color:var(--muted);padding:18px 4px;text-align:center;border:1.5px dashed var(--line);border-radius:14px;}
.task-row{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:9px;background:var(--card);border-radius:13px;box-shadow:0 1px 2px rgba(20,27,35,.05),0 4px 14px rgba(20,27,35,.05);flex-wrap:wrap;}
.task-row:last-child{margin-bottom:0;}
.task-body{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.task-actions{display:flex;gap:1px;flex-shrink:0;}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;color:#fff;font-size:14px;transition:all .15s;}
.chk:hover{border-color:var(--positive);}
.chk.on{background:var(--positive);border-color:var(--positive);}
.row-input{flex:1;border:none;background:transparent;font-size:13.5px;color:var(--text);padding:2px;min-width:60px;}
.row-input.wide{min-width:190px;}
.row-input.done-text{color:var(--muted);text-decoration:line-through;}
.time-input{font-family:var(--mono);font-size:11px;color:var(--muted);border:none;background:transparent;width:56px;text-align:right;flex-shrink:0;}
.src-badge{font-size:9.5px;padding:2px 6px;border-radius:5px;white-space:nowrap;flex-shrink:0;}
.src-badge.treino{background:#1F7A5C22;color:var(--positive);}
.src-badge.estudo{background:#B8963E22;color:var(--accent2);}
.src-badge.repeat{background:var(--line);color:var(--muted);}

/* Hábitos — emoji grande, sequência em destaque, barras preenchidas */
.hcard{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(20,27,35,.05),0 4px 14px rgba(20,27,35,.05);}
.hcard:last-child{margin-bottom:0;}
.hemoji{width:44px;height:44px;border-radius:13px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;border:none;cursor:pointer;}
.hbody{flex:1;min-width:150px;}
.hname-inp{font-size:14px;font-weight:600;}
.hbars{display:flex;gap:4px;margin-top:8px;}
.hbar{flex:1;height:10px;min-width:14px;border-radius:999px;border:none;background:var(--line);cursor:pointer;padding:0;}
.hbar.on{background:var(--positive);}
.hbar.today{box-shadow:0 0 0 2px var(--accent2);}
.hstreak{font-family:var(--mono);font-weight:700;font-size:13.5px;padding:5px 11px;border-radius:10px;flex-shrink:0;}
.hactions{display:flex;gap:1px;flex-shrink:0;}
.icon-suggest{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.icon-suggest button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.icon-suggest button:hover{border-color:var(--positive);}
.segmented{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px;gap:3px;}
.segmented button{flex:1;border:none;background:transparent;padding:7px 8px;font-size:12px;border-radius:7px;cursor:pointer;color:var(--muted);}
.segmented button.active{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08);}
.agenda-day-hd{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 4px;}
.agenda-day-hd:first-child{margin-top:0;}
.agenda-item{display:flex;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);align-items:flex-start;}
.agenda-item:last-child{border-bottom:none;}
.agenda-time{font-family:var(--mono);font-size:12px;color:var(--accent2);width:44px;flex-shrink:0;padding-top:1px;}
.agenda-title{font-size:13px;}
.agenda-tag{font-size:10.5px;color:var(--muted);}
.empty-hint{font-size:11.5px;color:var(--muted);padding:6px 2px;}
.routine-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.routine-row:last-child{border-bottom:none;}
.routine-day{width:34px;flex-shrink:0;font-size:11.5px;color:var(--muted);font-family:var(--mono);}
.routine-input{flex:1;border:none;background:transparent;font-size:13px;color:var(--text);min-width:0;}
.routine-input.wide{flex-basis:100%;margin-top:2px;}
.subtab-row{display:flex;gap:6px;margin-bottom:12px;}
.subtab{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:12px;color:var(--muted);cursor:pointer;}
.subtab.active{background:var(--positive);color:#fff;border-color:var(--positive);}
.area-pills{display:flex;gap:6px;flex-wrap:wrap;}
.ring-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.ring{position:relative;width:104px;height:104px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-label b{font-family:var(--mono);font-size:17px;}
.ring-label span{font-size:10px;color:var(--muted);}
.quick-add{display:flex;gap:6px;flex-wrap:wrap;}
.quick-add button{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;color:var(--text);cursor:pointer;font-family:var(--mono);}
.quick-add button:hover{border-color:var(--positive);color:var(--positive);}
.quick-add button.other{font-family:var(--sans);color:var(--muted);}
.goal-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px;}
.goal-row button{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:11.5px;text-decoration:underline;padding:0;}
.water-hist{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;}
.wh-item{flex:1;text-align:center;min-width:34px;}
.wh-day{font-size:9.5px;color:var(--muted);margin-bottom:4px;white-space:nowrap;}
.wh-mark{width:100%;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-family:var(--mono);}
.wh-mark.ok{background:#1F7A5C22;color:var(--positive);}
.wh-mark.warn{background:#B8963E22;color:var(--accent2);}
.wh-mark.no{background:#C1443D18;color:var(--negative);}
.goal-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.goal-item-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;font-weight:600;}
.bar-track{height:6px;background:var(--line);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:var(--positive);}
.goal-sub{font-size:11px;color:var(--muted);margin-top:5px;overflow-wrap:break-word;word-break:break-word;}
.hist-row{padding:6px 0;border-bottom:1px solid var(--line);}
.hist-row:last-child{border-bottom:none;}
.hist-note-inp{width:100%;min-height:34px;margin-top:4px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;color:var(--text);background:var(--paper);resize:vertical;box-sizing:border-box;overflow-wrap:break-word;}
.hist-note-view{font-size:12px;color:var(--text);margin-top:4px;overflow-wrap:break-word;word-break:break-word;white-space:pre-wrap;}
.week-bars{display:flex;align-items:flex-end;gap:8px;height:90px;}
.week-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
.week-bar{width:100%;background:var(--positive);border-radius:4px 4px 0 0;min-height:3px;}
.week-bar-lbl{font-size:9.5px;color:var(--muted);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-dow{font-size:10px;color:var(--muted);padding-bottom:4px;}
.cal-day{aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;background:var(--paper);}
.cal-day.today{outline:2px solid var(--accent2);}
.cal-dot{width:6px;height:6px;border-radius:50%;margin-top:2px;}
.stopwatch{text-align:center;padding:4px 0;}
.sw-label-inp{width:100%;text-align:center;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px 8px;font-size:12.5px;color:var(--text);margin-bottom:14px;}
.sw-time{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:1px;}
.sw-controls{display:flex;gap:10px;justify-content:center;margin-top:16px;}
.sw-btn{border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;}
.sw-btn.start{background:var(--positive);color:#fff;}
.sw-btn.pause{background:var(--accent2);color:#141414;}
.sw-btn.reset{background:transparent;border:1px solid var(--line);color:var(--muted);}

.empty-msg{padding:14px 8px;font-size:13px;color:var(--muted);}
.badge{padding:6px 10px;border-radius:10px;font-size:11px;font-family:var(--mono);}
@media(max-width:640px){header,.tabs,main{padding-left:14px;padding-right:14px;}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">

const fmt = n => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(n)||0);
const fmtFull = n => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(n)||0);
const sumArr = a => a.reduce((s,v)=>s+(Number(v)||0),0);
const sumByMonth = items => Array.from({length:12},(_,i)=>items.reduce((s,it)=>s+(Number(it.values[i])||0),0));
const withAlpha = (hex,a) => `${hex}${a}`;
const luminance = hex => {
  const c=(hex||"#888888").replace("#","");
  if(c.length<6) return .5;
  const r=parseInt(c.substr(0,2),16)/255, g=parseInt(c.substr(2,2),16)/255, b=parseInt(c.substr(4,2),16)/255;
  return .2126*r+.7152*g+.0722*b;
};
let uidCounter=1;
const nid = p => `${p||"it"}-${uidCounter++}-${Math.random().toString(36).slice(2,7)}`;
const mk = (name,group,values) => ({id:nid(group||"it"),name,group:group||null,recurring:false,values:(values&&values.length===12)?values.slice():Array(12).fill(0)});
const groupColor = (colorsArr,key) => { const i=groups.findIndex(g=>g.key===key); return (colorsArr||DEFAULT_CHART_COLORS)[i>=0?i:colorsArr.length-1]; };
const groupLabel = key => (groups.find(g=>g.key===key)||{}).label || "Outros";
const blankYear = () => ({income:[],patrimonio:[],expenses:[],debtors:[]});
const parseDueDay = name => {
  const m = name.match(/venc\.?\s*(\d{1,2})/i) || name.match(/dia\s*(\d{1,2})/i);
  if(!m) return null;
  const d=parseInt(m[1],10);
  return (d>=1&&d<=31)?d:null;
};
const esc = s => (s??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// ───────── CSV ─────────
function toCSV(yearData){
  const rows=[["Secao","Grupo","Item",...MONTHS]];
  const push=(secao,items)=>items.forEach(it=>rows.push([secao,it.group?groupLabel(it.group):"",it.name,...it.values.map(String)]));
  push("Faturamento",yearData.income); push("Despesas",yearData.expenses);
  push("Patrimonio",yearData.patrimonio); push("Devedores",yearData.debtors);
  return rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
}
function downloadCSV(filename,csvText){
  const blob=new Blob(["﻿"+csvText],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function parseCSVRows(text){
  return text.split(/\r?\n/).filter(l=>l.trim()).map(line=>{
    const cells=[]; let cur="",q=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else { if(c==='"')q=true; else if(c===";"){cells.push(cur);cur="";} else cur+=c; }
    }
    cells.push(cur); return cells;
  });
}
function fromCSV(text){
  const rows=parseCSVRows(text).slice(1);
  const keyByLabel=Object.fromEntries(groups.map(g=>[g.label,g.key]));
  const result={income:[],expenses:[],patrimonio:[],debtors:[]};
  rows.forEach(cells=>{
    if(cells.length<15)return;
    const [secao,grupoLabel,name,...vals]=cells;
    const values=vals.slice(0,12).map(v=>Number(v)||0);
    let group=null;
    if(secao==="Despesas"&&grupoLabel){
      if(!keyByLabel[grupoLabel]){
        // categoria nova encontrada no CSV: cria automaticamente nesta conta
        const newKey=nid("cat");
        groups=[...groups,{key:newKey,label:grupoLabel}];
        keyByLabel[grupoLabel]=newKey;
        openGroups[newKey]=true;
      }
      group=keyByLabel[grupoLabel];
    }
    const item=mk(name,group,values);
    if(secao==="Faturamento")result.income.push(item);
    else if(secao==="Despesas")result.expenses.push(item);
    else if(secao==="Patrimonio")result.patrimonio.push(item);
    else if(secao==="Devedores")result.debtors.push(item);
  });
  syncChartColors();
  return result;
}

function defaultRotina(){ return {tasks:[],habits:[],agenda:[],areas:[],routineItems:[],waterLog:{},waterGoal:2950,goals:[],autoTaskDone:{}}; }
const ROTINA_AREA_COLORS = ["#1F7A5C","#B8963E","#3D5A80","#9C6ADE","#C1443D","#4C7A5B","#2F6FEB","#C1673F"];
function migrateRotinaAreas(){
  if(rotina.areas && rotina.areas.length) return;
  const treinoId=nid("area"), estudoId=nid("area");
  rotina.areas=[{id:treinoId,emoji:"🏋️",name:"Treino",color:ROTINA_AREA_COLORS[0]},{id:estudoId,emoji:"📚",name:"Estudo",color:ROTINA_AREA_COLORS[1]}];
  rotina.routineItems=[
    ...(rotina.routineTreino||[]).map(r=>({id:r.id,areaId:treinoId,weekday:r.weekday,time:r.time,end:"",text:r.text,note:"",from:"",to:""})),
    ...(rotina.routineEstudo||[]).map(r=>({id:r.id,areaId:estudoId,weekday:r.weekday,time:r.time,end:"",text:r.text,note:"",from:"",to:""})),
  ];
  if(rotina.autoTaskDone){
    const migrated={};
    Object.entries(rotina.autoTaskDone).forEach(([k,v])=>{
      const parts=k.split("|");
      if(parts.length===3){
        const [date,kind,id]=parts;
        const newKind = kind==="treino"?treinoId:kind==="estudo"?estudoId:kind;
        migrated[date+"|"+newKind+"|"+id]=v;
      } else migrated[k]=v;
    });
    rotina.autoTaskDone=migrated;
  }
  delete rotina.routineTreino; delete rotina.routineEstudo;
}
let rotina=defaultRotina();

function syncChartColors(){
  // mantém chartColors alinhado 1:1 com groups (mesmo tamanho, cor nova ciclando DEFAULT_CHART_COLORS)
  chartColors = groups.map((g,i)=> chartColors[i] || DEFAULT_CHART_COLORS[i%DEFAULT_CHART_COLORS.length]);
  groups.forEach(g=>{ if(!(g.key in openGroups)) openGroups[g.key]=true; });
}
function addCategory(label){
  const key=nid("cat");
  groups=[...groups,{key,label}];
  syncChartColors();
  scheduleSave(); renderAll(); renderAppearancePanel();
}
function renameCategory(key,label){
  groups=groups.map(g=>g.key===key?{...g,label}:g);
  scheduleSave(); renderAll(); renderAppearancePanel();
}
function deleteCategory(key){
  const hasItems=data().expenses.some(it=>it.group===key);
  if(hasItems){ alert("Essa categoria tem itens de despesa lançados. Apague ou mude o grupo desses itens antes de excluir a categoria."); return; }
  const idx=groups.findIndex(g=>g.key===key);
  groups=groups.filter(g=>g.key!==key);
  if(idx>=0) chartColors=chartColors.filter((c,i)=>i!==idx);
  delete budgets[key];
  delete openGroups[key];
  scheduleSave(); renderAll(); renderAppearancePanel();
}

function theme(){
  const autoOnInk=luminance(colors.ink)>.6?"#141414":"#FFFFFF";
  const autoOnAccent=luminance(colors.positive)>.6?"#141414":"#FFFFFF";
  return {...colors, line:withAlpha(colors.muted,"33"),
    onInk: colors.onInk||autoOnInk,
    onAccent: colors.onAccent||autoOnAccent};
}
function applyThemeVars(){
  const t=theme();
  const root=document.documentElement.style;
  Object.entries(t).forEach(([k,v])=>root.setProperty("--"+k,v));
}

// ───────── DADOS (Firestore) ─────────
function startDataListener(uid){
  const stateRef=doc(db,"users",uid,"data","state");
  unsubState=onSnapshot(stateRef, async snap=>{
    applyingRemote=true;
    if(snap.exists()){
      const d=snap.data();
      years=d.years||{[REAL_YEAR]:blankYear()};
      year=(d.currentYear&&years[d.currentYear])?d.currentYear:Number(Object.keys(years)[0]);
      monthSel=(d.focusMonth==="all"||typeof d.focusMonth==="number")?d.focusMonth:REAL_MONTH;
      colors=d.colors||{...PRESETS[0].colors};
      groups=(d.groups&&d.groups.length)?d.groups:DEFAULT_CATS.map(g=>({...g}));
      chartColors=(d.chartColors&&d.chartColors.length===groups.length)?d.chartColors:groups.map((g,i)=>DEFAULT_CHART_COLORS[i%DEFAULT_CHART_COLORS.length]);
      chartStyle=d.chartStyle||"bar";
      budgets=d.budgets||{};
      goals=d.goals||[];
      openGroups=Object.fromEntries(groups.map(g=>[g.key,(d.openGroups&&g.key in d.openGroups)?d.openGroups[g.key]:true]));

function scheduleSave(){
  if(!loaded||!user||applyingRemote) return;
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const stateRef=doc(db,"users",user.uid,"data","state");
    setDoc(stateRef,{years,currentYear:year,focusMonth:monthSel,colors,groups,chartColors,chartStyle,budgets,goals,openGroups,sharedWith,sharedWithUids:sharedWith.map(s=>s.uid),watching,wrapNames,uiIcons,appSection,rotina}).catch(()=>{});

}

// ───────── VISÃO COMBINADA (só leitura, tempo real) ─────────
function subscribeWatched(){
  const activeUids=new Set(watching.map(w=>w.uid));
  Object.keys(watchedUnsubs).forEach(uid=>{ if(!activeUids.has(uid)){ watchedUnsubs[uid](); delete watchedUnsubs[uid]; delete watchedData[uid]; } });
  watching.forEach(w=>{
    if(watchedUnsubs[w.uid]) return;
    const ref=doc(db,"users",w.uid,"data","state");
    watchedUnsubs[w.uid]=onSnapshot(ref, snap=>{
      watchedData[w.uid]={ok:snap.exists(),data:snap.exists()?snap.data():null,email:w.email};
      if(tab==="combinada") renderAll();
    }, ()=>{
      watchedData[w.uid]={ok:false,email:w.email};
      if(tab==="combinada") renderAll();
    });
  });
}
async function shareWith(rawEmail){
  const email=emailDocId(rawEmail);
  if(!email) return;
  try{
    const snap=await getDoc(doc(db,"emailIndex",email));
    if(!snap.exists()){ alert("Não encontrei nenhuma conta Log Pose com esse e-mail."); return; }
    const targetUid=snap.data().uid;
    if(targetUid===user.uid){ alert("Esse é o seu próprio e-mail."); return; }
    if(sharedWith.some(s=>s.uid===targetUid)) return;
    sharedWith=[...sharedWith,{uid:targetUid,email}];
    scheduleSave(); renderAll();
  }catch(e){ alert("Não foi possível compartilhar agora."); }
}
function unshareWith(uid){ sharedWith=sharedWith.filter(s=>s.uid!==uid); scheduleSave(); renderAll(); }
async function watchEmail(rawEmail){
  const email=emailDocId(rawEmail);
  if(!email) return;
  try{
    const snap=await getDoc(doc(db,"emailIndex",email));
    if(!snap.exists()){ alert("Não encontrei nenhuma conta Log Pose com esse e-mail."); return; }
    const targetUid=snap.data().uid;
    if(targetUid===user.uid){ alert("Esse é o seu próprio e-mail."); return; }
    if(watching.some(w=>w.uid===targetUid)) return;
    watching=[...watching,{uid:targetUid,email}];
    scheduleSave(); subscribeWatched(); renderAll();
  }catch(e){ alert("Não foi possível adicionar agora."); }
}
function unwatch(uid){
  watching=watching.filter(w=>w.uid!==uid);
  if(watchedUnsubs[uid]){ watchedUnsubs[uid](); delete watchedUnsubs[uid]; }
  delete watchedData[uid];
  scheduleSave(); renderAll();
}
function personTotals(yearsObj,em,forcedYear){
  const y=yearsObj[forcedYear]||yearsObj[Object.keys(yearsObj)[0]]||blankYear();
  const debt=sumByMonth(y.debtors);
  const inc=sumByMonth(y.income).map((v,i)=>v+debt[i]);
  const exp=sumByMonth(y.expenses);
  const pat=sumByMonth(y.patrimonio);
  return {income:inc[em]||0, expense:exp[em]||0, patrimonio:pat[em]||0, saldo:(inc[em]||0)-(exp[em]||0)-(pat[em]||0)};
}

// ───────── MUTAÇÕES ─────────
function data(){ return years[year]||blankYear(); }
function isAllMonths(){ return monthSel==="all"; }
function effectiveMonth(){ return isAllMonths()?(Number(year)===REAL_YEAR?REAL_MONTH:0):monthSel; }

function updateValue(section,itemId,monthIdx,val){
  const y=years[year];
  y[section]=y[section].map(it=>{
    if(it.id!==itemId) return it;
    const newVal=val===""?0:Number(val);
    let values=it.values.map((v,i)=>i===monthIdx?newVal:v);
    if(it.recurring) values=values.map((v,i)=>i>monthIdx?newVal:v);
    return {...it,values};
  });
  scheduleSave(); renderAll();
  if(pendingCellFocus){
    const {containerId,itemId:tid,month:tm}=pendingCellFocus;
    pendingCellFocus=null;
    const cont=document.getElementById(containerId);
    const el=cont&&cont.querySelector(`[data-val="${tid}"][data-month="${tm}"]`);
    if(el){ el.focus(); el.select&&el.select(); }
  }
}
function toggleRecurring(section,itemId){
  const y=years[year];
  const it=y[section].find(i=>i.id===itemId);
  if(it&&!it.recurring){
    if(!confirm('Marcar como recorrente copia o valor do mês em foco para todos os meses seguintes deste ano sempre que você editar esse valor, substituindo o que já estiver lá. Continuar?')) return;
  }
  y[section]=y[section].map(i=>i.id===itemId?{...i,recurring:!i.recurring}:i);
  scheduleSave(); renderAll();
}
function renameItem(section,itemId,name){
  const y=years[year]; y[section]=y[section].map(it=>it.id===itemId?{...it,name}:it);
  scheduleSave();
}
function addItem(section,name,group){
  const y=years[year]; y[section]=[...y[section],mk(name,group||null)];
  scheduleSave(); renderAll();
}
function deleteItem(section,itemId){
  const y=years[year]; y[section]=y[section].filter(it=>it.id!==itemId);
  scheduleSave(); renderAll();
}
function addYear(){
  const input=prompt("Qual ano você quer adicionar? (ex: 2028)");
  if(!input) return;
  const num=parseInt(input,10);
  if(!num||num<2000||num>2100) return;
  if(!years[num]) years[num]=blankYear();
  year=num; monthSel=(num===REAL_YEAR)?REAL_MONTH:0; tab="dashboard";
  scheduleSave(); renderShell(); renderAll();
}
function changeYear(y){ year=y; monthSel=(y===REAL_YEAR)?REAL_MONTH:0; scheduleSave(); renderAll(); }
function addGoal(g){ goals=[...goals,{...g,id:nid("goal")}]; scheduleSave(); renderAll(); }
function deleteGoal(id){
  goals=goals.filter(g=>g.id!==id);
  Object.keys(years).forEach(y=>{ years[y].patrimonio=years[y].patrimonio.map(it=>it.goalId===id?{...it,goalId:null}:it); });
  scheduleSave(); renderAll();
}
function setChartColor(i,v){ chartColors=chartColors.map((c,idx)=>idx===i?v:c); scheduleSave(); renderAll(); renderAppearancePanel(); }
function setColor(k,v){ colors={...colors,[k]:v}; applyThemeVars(); scheduleSave(); renderShell(); renderAll(); renderAppearancePanel(); }

// ───────── CÁLCULOS ─────────
function computeAll(){
  const d=data();
  const debtorsByMonth=sumByMonth(d.debtors);
  const incomeByMonth=sumByMonth(d.income).map((v,i)=>v+debtorsByMonth[i]);
  const expenseByMonth=sumByMonth(d.expenses);
  const patrimonioByMonth=sumByMonth(d.patrimonio);
  const saldoByMonth=incomeByMonth.map((v,i)=>v-expenseByMonth[i]-patrimonioByMonth[i]);
  const em=effectiveMonth();
  const patrimonioAllYears=Object.keys(years).reduce((s,y)=>s+sumArr(years[y].patrimonio.map(it=>sumArr(it.values))),0);
  return {
    d, debtorsByMonth, incomeByMonth, expenseByMonth, patrimonioByMonth, saldoByMonth,
    incomeAnnual:sumArr(incomeByMonth), expenseAnnual:sumArr(expenseByMonth),
    patrimonioAnnual:patrimonioAllYears,
    debtAnnual:sumArr(d.debtors.map(it=>sumArr(it.values))),
    monthIncome:incomeByMonth[em]||0, monthExpense:expenseByMonth[em]||0, monthPatrimonio:patrimonioByMonth[em]||0,
    monthSaldo:(incomeByMonth[em]||0)-(expenseByMonth[em]||0)-(patrimonioByMonth[em]||0),
    prevMonthSaldo: em>0?saldoByMonth[em-1]:null, em
  };
}

      ${idxs.map(i=>`<td class="num"><input class="cell-input num" type="number" placeholder="0" value="${it.values[i]===0?"":it.values[i]}" data-val="${it.id}" data-month="${i}"></td>`).join("")}

  });

    rowsHtml+=`<tr>

      ${showTotal?`<td class="num" style="color:var(--muted);font-weight:600">${fmt(rowTotal)}</td>`:""}
      <td></td></tr>`;
  }
  if(!items.length && !lockedRow) rowsHtml=`<tr><td colspan="16" class="empty-msg">Nenhum item ainda. Adicione abaixo.</td></tr>`;
  return `<div class="mtable-scroll"><table class="mtable">

let mtableScrollPos={}; // containerId -> scrollLeft, pra não perder a posição ao editar um valor
let pendingCellFocus=null; // {containerId,itemId,month} — pra onde voltar o foco depois do re-render (Tab/Enter)
function wireMonthlyTable(container,section,extraCol){
  container.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>toggleRecurring(section,b.dataset.rec));
  container.querySelectorAll("[data-rename]").forEach(inp=>inp.onchange=()=>renameItem(section,inp.dataset.rename,inp.value));
  container.querySelectorAll("[data-val]").forEach(inp=>{
    inp.onchange=()=>updateValue(section,inp.dataset.val,Number(inp.dataset.month),inp.value);
    inp.onkeydown=(e)=>{
      if(e.key!=="Tab"&&e.key!=="Enter") return;
      const itemId=inp.dataset.val, month=Number(inp.dataset.month);
      let targetItemId=itemId, targetMonth=month;
      if(e.key==="Tab"){
        const rowInputs=[...container.querySelectorAll(`[data-val="${itemId}"]`)];
        const idx=rowInputs.indexOf(inp), nextIdx=e.shiftKey?idx-1:idx+1;
        if(nextIdx<0||nextIdx>=rowInputs.length) return; // deixa o Tab padrão sair da tabela
        e.preventDefault();
        targetMonth=Number(rowInputs[nextIdx].dataset.month);
      } else {
        const colInputs=[...container.querySelectorAll(`[data-val][data-month="${month}"]`)];
        const idx=colInputs.indexOf(inp), nextIdx=e.shiftKey?idx-1:idx+1;
        if(nextIdx<0||nextIdx>=colInputs.length) return;
        e.preventDefault();
        targetItemId=colInputs[nextIdx].dataset.val;
      }
      pendingCellFocus={containerId:container.id,itemId:targetItemId,month:targetMonth};
      inp.onchange=null;
      updateValue(section,itemId,month,inp.value);
    };
  });
  container.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ if(confirm("Remover item?")) deleteItem(section,b.dataset.del); });
  if(extraCol) extraCol.wire(container);
  const scrollWrap=container.querySelector(".mtable-scroll");
  if(scrollWrap){
    if(container.id&&mtableScrollPos[container.id]!=null) scrollWrap.scrollLeft=mtableScrollPos[container.id];
    scrollWrap.onscroll=()=>{ if(container.id) mtableScrollPos[container.id]=scrollWrap.scrollLeft; };
  }
}
const catExtraCol={
  label:"Categoria",
  render: it=>`<select data-catmove="${it.id}" style="font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:var(--paper);color:var(--text);max-width:140px">${groups.map(g=>`<option value="${g.key}" ${g.key===it.group?"selected":""}>${esc(g.label)}</option>`).join("")}</select>`,
  wire: container=>container.querySelectorAll("[data-catmove]").forEach(sel=>sel.onchange=()=>moveItemCategory(sel.dataset.catmove,sel.value))
};
function moveItemCategory(itemId,newGroup){
  const y=years[year]; y.expenses=y.expenses.map(it=>it.id===itemId?{...it,group:newGroup}:it);
  scheduleSave(); renderAll();
}
const goalExtraCol={
  label:"Meta",
  render: it=>`<select data-goalassign="${it.id}" style="font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:var(--paper);color:var(--text);max-width:140px">
    <option value="">Nenhuma</option>
    ${goals.map(g=>`<option value="${g.id}" ${g.id===it.goalId?"selected":""}>${esc(g.name)}</option>`).join("")}
    <option value="__new__">+ Nova meta…</option>
  </select>`,
  wire: container=>container.querySelectorAll("[data-goalassign]").forEach(sel=>sel.onchange=()=>{
    if(sel.value==="__new__"){
      const name=prompt("Nome da nova meta:");
      if(!name){ sel.value=it_goal(sel.dataset.goalassign); return; }
      const target=Number(prompt("Valor alvo da meta:"));
      if(!target||target<=0){ sel.value=it_goal(sel.dataset.goalassign); return; }
      const newGoal={name,target,month:REAL_MONTH,year:REAL_YEAR,id:nid("goal")};
      goals=[...goals,newGoal];
      assignItemGoal(sel.dataset.goalassign,newGoal.id);
    } else {
      assignItemGoal(sel.dataset.goalassign, sel.value||null);
    }
  })
};
function it_goal(itemId){ const it=data().patrimonio.find(i=>i.id===itemId); return (it&&it.goalId)||""; }
function assignItemGoal(itemId,goalId){
  const y=years[year]; y.patrimonio=y.patrimonio.map(it=>it.id===itemId?{...it,goalId:goalId||null}:it);
  scheduleSave(); renderAll();
}
function goalCurrent(goalId){
  let total=0;
  Object.values(years).forEach(y=>{ y.patrimonio.forEach(it=>{ if(it.goalId===goalId) total+=sumArr(it.values); }); });
  return total;
}
function addRowHTML(placeholder,id){
  return `<div class="add-row"><input type="text" id="${id}-inp" placeholder="${esc(placeholder)}"><button id="${id}-btn">＋ Adicionar</button></div>`;
}
function wireAddRow(id,onAdd){
  const inp=document.getElementById(id+"-inp"), btn=document.getElementById(id+"-btn");
  const submit=()=>{ if(inp.value.trim()){ onAdd(inp.value.trim()); inp.value=""; } };
  btn.onclick=submit;
  inp.onkeydown=e=>{ if(e.key==="Enter") submit(); };
}

  if(chartPie) chartPie.destroy();

}

function renderDespesas(c){
  const {expenseByMonth,expenseAnnual}=computeAll();

  if(isAllMonths()){
    html+=`<div style="display:flex;gap:6px;flex-wrap:wrap">${MONTHS.map((m,i)=>`<span class="badge" style="background:${withAlpha(colors.negative,"18")};color:var(--negative);${i===em?`border:1.5px solid var(--negative)`:""};display:flex;flex-direction:column;align-items:center;min-width:58px">${m}<strong>${fmt(expenseByMonth[i])}</strong></span>`).join("")}</div>`;
  } else {
    html+=`<p style="font-size:12.5px;color:var(--muted)">Mostrando somente ${MONTHS[em]}. Selecione "Todos os meses" no topo para ver o ano inteiro lado a lado.</p>`;
  }
  html+=`<p style="font-size:11.5px;color:var(--muted);margin-top:12px">Total do ano: <strong style="color:var(--text)">${fmtFull(expenseAnnual)}</strong></p></div>`;

  groups.forEach((g,gi)=>{
    const items=data().expenses.filter(it=>it.group===g.key);
    const spent=sumArr(items.map(it=>it.values[em]||0));
    const color=groupColor(chartColors,g.key);
    const subtotal=isAllMonths()?sumArr(items.map(it=>sumArr(it.values))):spent;
    const budget=budgets[g.key]||0;
    const pct=budget?Math.round(spent/budget*100):0;
    const barColor=pct>100?"var(--negative)":pct>=80?"var(--accent2)":"var(--positive)";
    html+=`<div class="group-card">
      <div class="group-hd">
        <span style="display:flex;align-items:center;gap:8px;font-weight:600"><label class="swatch" style="width:16px;height:16px;background:${color}"><input type="color" value="${color}" data-chartcoloridx3="${gi}"></label><button data-toggle="${g.key}" style="background:none;border:none;cursor:pointer;font-weight:600;color:var(--text);font-size:13.5px">${g.label}</button></span>

      <div style="padding:0 16px 10px">
        ${budget?`<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px"><span>Meta de ${MONTHS[em]}: ${fmt(budget)} · gasto ${fmt(spent)}</span><span style="color:${barColor};font-weight:600">${pct}%</span></div><div class="budget-bar-track"><div class="budget-bar-fill" style="width:${Math.min(100,pct)}%;background:${barColor}"></div></div>`:""}
      </div>
      ${openGroups[g.key]?`<div style="padding:0 16px 16px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><label style="font-size:12px;color:var(--muted)">Meta mensal:</label><input type="number" data-budget="${g.key}" value="${budget||""}" placeholder="sem meta" style="width:100px;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:12.5px;background:var(--paper);color:var(--text)"></div>
        <div id="groupTable-${g.key}"></div>
        ${addRowHTML(`Novo item em "${g.label}"`,`groupAdd-${g.key}`)}
      </div>`:""}
    </div>`;
  });
  html+=`<div style="background:var(--ink);color:var(--onInk);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;font-family:var(--mono);font-weight:700">
    <span style="font-family:var(--sans);font-weight:600">${isAllMonths()?"Total de despesas no ano":`Total de despesas em ${MONTHS[em]}`}</span>

// ───────── ROTINA: TAREFAS ─────────
function tasksToday(){
  const wd=new Date().getDay(), ds=todayStr();
  return rotina.tasks.filter(t=> t.repeatWeekly ? t.weekday===wd : t.date===ds);
}
function addTask(name,time,repeatWeekly){
  const now=new Date();
  rotina.tasks.push({id:nid("task"), name, time:time||"--:--", repeatWeekly:!!repeatWeekly, weekday:now.getDay(), date:todayStr(), done:{}});
  scheduleSave(); renderAll();
}
function renameTask(id,name){ const t=rotina.tasks.find(x=>x.id===id); if(t) t.name=name; scheduleSave(); }
function retimeTask(id,time){ const t=rotina.tasks.find(x=>x.id===id); if(t) t.time=time; scheduleSave(); }
function deleteTask(id){ rotina.tasks=rotina.tasks.filter(x=>x.id!==id); scheduleSave(); renderAll(); }
function moveTask(id,dir,visibleIds){
  const list=visibleIds||rotina.tasks.map(t=>t.id);
  const pos=list.indexOf(id), swapPos=pos+dir;
  if(pos<0||swapPos<0||swapPos>=list.length) return;
  const otherId=list[swapPos];
  const idxA=rotina.tasks.findIndex(t=>t.id===id), idxB=rotina.tasks.findIndex(t=>t.id===otherId);
  if(idxA<0||idxB<0) return;
  const arr=rotina.tasks; [arr[idxA],arr[idxB]]=[arr[idxB],arr[idxA]];
  scheduleSave(); renderAll();
}
function toggleTaskDone(id){
  const t=rotina.tasks.find(x=>x.id===id); if(!t) return;
  const ds=todayStr(); t.done=t.done||{};
  if(t.done[ds]) delete t.done[ds]; else t.done[ds]=true;
  scheduleSave(); renderAll();
}
function itemValidToday(r,ds){ return (!r.from||ds>=r.from) && (!r.to||ds<=r.to); }
function autoTasksToday(){
  const wd=new Date().getDay(), ds=todayStr();
  return rotina.routineItems.filter(r=>r.weekday===wd && itemValidToday(r,ds)).map(r=>{
    const a=rotina.areas.find(x=>x.id===r.areaId)||{emoji:"⭐",name:"Área",color:"#888"};
    return {id:r.id, areaId:r.areaId, text:r.text, time:r.time, end:r.end, note:r.note, emoji:a.emoji, areaName:a.name, color:a.color};
  }).sort((a,b)=>a.time.localeCompare(b.time));
}
function toggleAutoDone(areaId,id,text,time){
  const key=todayStr()+"|"+areaId+"|"+id;
  if(rotina.autoTaskDone[key]) delete rotina.autoTaskDone[key];
  else rotina.autoTaskDone[key]={date:todayStr(),text:text||"",time:time||""};
  scheduleSave(); renderAll();
}
function markAllToday(){
  const ds=todayStr();
  tasksToday().forEach(t=>{ t.done=t.done||{}; t.done[ds]=true; });
  autoTasksToday().forEach(a=>{ rotina.autoTaskDone[ds+"|"+a.areaId+"|"+a.id]={date:ds,text:a.text,time:a.time}; });
  scheduleSave(); renderAll();
}

function routineDaysHist(areaId){
  const arr=[];
  for(let i=6;i>=0;i--){
    const d=addDays(new Date(),-i), ds=dateStr(d), wd=d.getDay();
    const scheduled=rotina.routineItems.filter(r=>r.areaId===areaId && r.weekday===wd && itemValidToday(r,ds));
    const doneCount=scheduled.filter(r=>rotina.autoTaskDone[ds+"|"+areaId+"|"+r.id]).length;
    const pct = scheduled.length? Math.round(doneCount/scheduled.length*100) : null;
    arr.push({label:i===0?"Hoje":DOW_SHORT[wd], pct});
  }
  return arr;
}
function routineWeeksHist(areaId,n){
  const res=[]; const today=new Date();
  for(let w=n-1; w>=0; w--){
    let scheduledDays=0, doneDays=0;
    for(let i=0;i<7;i++){
      const d=addDays(today,-(w*7+i)), ds=dateStr(d), wd=d.getDay();
      const scheduled=rotina.routineItems.filter(r=>r.areaId===areaId && r.weekday===wd && itemValidToday(r,ds));
      if(!scheduled.length) continue;
      scheduledDays++;
      if(scheduled.every(r=>rotina.autoTaskDone[ds+"|"+areaId+"|"+r.id])) doneDays++;
    }
    res.push({label:"Sem "+(n-w), pct: scheduledDays? Math.round(doneDays/scheduledDays*100) : null});
  }
  return res;
}
function routineMonthsHist(areaId,n){
  const res=[]; const today=new Date();
  for(let m=n-1;m>=0;m--){
    const ref=new Date(today.getFullYear(), today.getMonth()-m, 1);
    const y=ref.getFullYear(), mo=ref.getMonth();
    const daysInMonth=new Date(y,mo+1,0).getDate();
    let scheduledDays=0, doneDays=0;
    for(let day=1; day<=daysInMonth; day++){
      const d=new Date(y,mo,day); if(d>today) continue;
      const ds=dateStr(d), wd=d.getDay();
      const scheduled=rotina.routineItems.filter(r=>r.areaId===areaId && r.weekday===wd && itemValidToday(r,ds));
      if(!scheduled.length) continue;
      scheduledDays++;
      if(scheduled.every(r=>rotina.autoTaskDone[ds+"|"+areaId+"|"+r.id])) doneDays++;
    }
    const lbl=ref.toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
    res.push({label:lbl.charAt(0).toUpperCase()+lbl.slice(1), pct: scheduledDays? Math.round(doneDays/scheduledDays*100) : null});
  }
  return res;
}
function routineLog(areaId,limit){
  return Object.entries(rotina.autoTaskDone)
    .filter(([k])=>k.split("|")[1]===areaId)
    .map(([,v])=>v)
    .filter(v=>v&&v.date)
    .sort((a,b)=>b.date.localeCompare(a.date))
    .slice(0, limit||10);
}

function waterToday(){ return rotina.waterLog[todayStr()]||0; }
function addWater(ml){ rotina.waterLog[todayStr()]=Math.min(rotina.waterGoal*2, waterToday()+ml); scheduleSave(); renderAll(); }
function subtractWater(ml){ rotina.waterLog[todayStr()]=Math.max(0, waterToday()-ml); scheduleSave(); renderAll(); }

function setWaterForDate(ds,ml){ rotina.waterLog[ds]=Math.max(0,ml); scheduleSave(); renderAll(); }
function waterLast7(){
  const arr=[];
  for(let i=6;i>=0;i--){ const d=addDays(new Date(),-i); arr.push({label:i===0?"Hoje":DOW_SHORT[d.getDay()], ml: rotina.waterLog[dateStr(d)]||0}); }
  return arr;
}
function waterWeeks(n){
  const res=[]; const today=new Date();
  for(let w=n-1; w>=0; w--){
    let met=0;
    for(let i=0;i<7;i++){ const d=addDays(today,-(w*7+i)); if((rotina.waterLog[dateStr(d)]||0)>=rotina.waterGoal) met++; }
    res.push({label:"Sem "+(n-w), pct:Math.round(met/7*100)});
  }
  return res;
}
function waterMonths(n){
  const res=[]; const today=new Date();
  for(let m=n-1;m>=0;m--){
    const ref=new Date(today.getFullYear(), today.getMonth()-m, 1);
    const y=ref.getFullYear(), mo=ref.getMonth();
    const daysInMonth=new Date(y,mo+1,0).getDate();
    let met=0, counted=0;
    for(let day=1; day<=daysInMonth; day++){
      const d=new Date(y,mo,day); if(d>today) continue;
      counted++; if((rotina.waterLog[dateStr(d)]||0)>=rotina.waterGoal) met++;
    }
    const lbl=ref.toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
    res.push({label:lbl.charAt(0).toUpperCase()+lbl.slice(1), pct: counted?Math.round(met/counted*100):0});
  }
  return res;
}

const DASH_QUICK_PICKS = [
  {label:"7 dias", n:7, unit:"days"},
  {label:"30 dias", n:30, unit:"days"},
  {label:"3 meses", n:3, unit:"months"},
  {label:"6 meses", n:6, unit:"months"},
  {label:"1 ano", n:12, unit:"months"},
];
function unitToDays(n,unit){ n=Math.max(1,Number(n)||1); return unit==="weeks"?n*7 : unit==="months"?n*30 : n; }
function rangeDates(days){ const arr=[]; for(let i=days-1;i>=0;i--) arr.push(addDays(new Date(),-i)); return arr; }
function dashboardStats(days){
  const dates=rangeDates(days), dateStrs=dates.map(dateStr);
  const habitPct = rotina.habits.length ? Math.round(
    dateStrs.reduce((s,ds)=>s+(rotina.habits.filter(h=>h.log&&h.log[ds]).length/rotina.habits.length),0)/dateStrs.length*100
  ) : null;
  const perHabit = rotina.habits.map(h=>{
    const done=dateStrs.filter(ds=>h.log&&h.log[ds]).length;
    return {name:h.name, emoji:h.emoji, pct:Math.round(done/dateStrs.length*100)};
  });
  const waterDaysWithData = dateStrs.filter(ds=>ds in rotina.waterLog).length;
  const waterMet = dateStrs.filter(ds=>(rotina.waterLog[ds]||0)>=rotina.waterGoal).length;
  const waterPct = Math.round(waterMet/dateStrs.length*100);
  const perArea = rotina.areas.map(a=>{
    let scheduledDays=0, doneDays=0;
    dates.forEach(d=>{
      const ds=dateStr(d), wd=d.getDay();
      const scheduled=rotina.routineItems.filter(r=>r.areaId===a.id && r.weekday===wd && itemValidToday(r,ds));
      if(!scheduled.length) return;
      scheduledDays++;
      if(scheduled.every(r=>rotina.autoTaskDone[ds+"|"+a.id+"|"+r.id])) doneDays++;
    });
    return {name:a.name, emoji:a.emoji, color:a.color, pct: scheduledDays?Math.round(doneDays/scheduledDays*100):null};
  });
  const repeatTasks = rotina.tasks.filter(t=>t.repeatWeekly);
  const taskPct = repeatTasks.length ? Math.round(
    dates.reduce((s,d)=>{
      const wd=d.getDay(), ds=dateStr(d);
      const dueToday=repeatTasks.filter(t=>t.weekday===wd);
      if(!dueToday.length) return s;
      return s + dueToday.filter(t=>t.done&&t.done[ds]).length/dueToday.length;
    },0) / dates.filter(d=>repeatTasks.some(t=>t.weekday===d.getDay())).length * 100
  ) || 0 : null;
  return {habitPct, perHabit, waterPct, waterDaysWithData, perArea, taskPct, dates, dateStrs};
}
function dashboardTrend(days){
  const dates=rangeDates(days);
  const bucketSize = days>180?30 : days>28?7 : 1;
  const buckets=[];
  for(let i=0;i<dates.length;i+=bucketSize){
    const slice=dates.slice(i,i+bucketSize);
    const dsSlice=slice.map(dateStr);
    const habitPct = rotina.habits.length ? Math.round(
      dsSlice.reduce((s,ds)=>s+(rotina.habits.filter(h=>h.log&&h.log[ds]).length/rotina.habits.length),0)/dsSlice.length*100
    ) : 0;
    const waterPct = Math.round(dsSlice.filter(ds=>(rotina.waterLog[ds]||0)>=rotina.waterGoal).length/dsSlice.length*100);
    const label = bucketSize===1 ? `${slice[0].getDate()}/${slice[0].getMonth()+1}`
      : bucketSize===7 ? `${slice[0].getDate()}/${slice[0].getMonth()+1}`
      : slice[0].toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
    buckets.push({label, habitPct, waterPct});
  }
  return buckets;
}
function habitTrend(habitId,days){
  const dates=rangeDates(days);
  const bucketSize = days>180?30 : days>28?7 : 1;
  const h=rotina.habits.find(x=>x.id===habitId);
  const buckets=[];
  for(let i=0;i<dates.length;i+=bucketSize){
    const slice=dates.slice(i,i+bucketSize);
    const dsSlice=slice.map(dateStr);
    const pct = h? Math.round(dsSlice.filter(ds=>h.log&&h.log[ds]).length/dsSlice.length*100) : 0;
    const label = bucketSize===1||bucketSize===7 ? `${slice[0].getDate()}/${slice[0].getMonth()+1}` : slice[0].toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
    buckets.push({label,pct});
  }
  return buckets;
}
function goalWeeklyHistory(g,weeks){
  const arr=[];
  const today=new Date(), thisSunday=addDays(today,-today.getDay());
  for(let w=weeks-1; w>=0; w--){
    const startSunday=addDays(thisSunday,-7*w);
    let count=0;
    if(g.linkedHabitId){
      const h=rotina.habits.find(x=>x.id===g.linkedHabitId);
      if(h) for(let i=0;i<7;i++){ const ds=dateStr(addDays(startSunday,i)); if(h.log&&h.log[ds]) count++; }
    }
    arr.push({label: w===0?"Essa semana":`-${w}sem`, count, pct: g.target? Math.round(count/g.target*100):0});
  }
  return arr;
}
function exportRotinaCSV(){
  const rows=[["Tipo","Nome","Data","Status/Valor","Observação"]];
  rotina.habits.forEach(h=>{
    Object.keys(h.log||{}).sort().forEach(ds=>rows.push(["Hábito", h.name, ds, "Concluído", (h.notes&&h.notes[ds])||""]));
  });
  Object.keys(rotina.waterLog||{}).sort().forEach(ds=>{
    rows.push(["Água","Água do dia", ds, rotina.waterLog[ds]+"ml", rotina.waterLog[ds]>=rotina.waterGoal?"Meta batida":"Não bateu a meta"]);
  });
  rotina.tasks.forEach(t=>{
    Object.keys(t.done||{}).sort().forEach(ds=>rows.push(["Tarefa", t.name, ds, "Concluída", ""]));
  });
  Object.entries(rotina.autoTaskDone||{}).forEach(([k,v])=>{
    if(v&&v.date) rows.push(["Área", v.text||"", v.date, "Concluída", v.time||""]);
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
  downloadCSV("log-pose-rotina-historico.csv", csv);
}
function exportRotinaPDF(){
  if(!window.jspdf){ alert("Não consegui carregar o gerador de PDF. Verifique sua conexão e tente de novo."); return; }
  const doc=new window.jspdf.jsPDF();
  let y=15;
  doc.setFontSize(16); doc.text("Log Pose — Histórico de Rotina", 14, y); y+=10;
  doc.setFontSize(10);
  function addLine(txt){ if(y>280){ doc.addPage(); y=15; } doc.text(String(txt).slice(0,110), 14, y); y+=6; }
  addLine("Hábitos:");
  if(!rotina.habits.length) addLine("  (nenhum hábito ainda)");
  rotina.habits.forEach(h=>{
    const days=Object.keys(h.log||{}).sort();
    if(!days.length){ addLine(`  ${h.name}: nenhum dia marcado`); return; }
    days.forEach(ds=>addLine(`  ${ds} — ${h.name}${h.notes&&h.notes[ds]?": "+h.notes[ds]:""}`));
  });
  y+=4; addLine("Água:");
  const waterDays=Object.keys(rotina.waterLog||{}).sort();
  if(!waterDays.length) addLine("  (nenhum registro ainda)");
  waterDays.forEach(ds=>addLine(`  ${ds} — ${rotina.waterLog[ds]}ml ${rotina.waterLog[ds]>=rotina.waterGoal?"(meta batida)":""}`));
  y+=4; addLine("Tarefas concluídas:");
  let anyTask=false;
  rotina.tasks.forEach(t=>{ Object.keys(t.done||{}).sort().forEach(ds=>{ addLine(`  ${ds} — ${t.name}`); anyTask=true; }); });
  if(!anyTask) addLine("  (nenhuma ainda)");
  doc.save("log-pose-rotina-historico.pdf");
}
