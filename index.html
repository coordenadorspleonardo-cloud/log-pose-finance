          <input type="number" id="rtWaterEditVal" placeholder="ml daquele dia">
          <button id="rtWaterEditSave">Salvar dia anterior</button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:14px 0 4px">Histórico:</p>
        <div class="segmented" id="rtWaterHistSeg">
          <button class="${waterHistScale==="days"?"active":""}" data-scale="days">Últimos 7 dias</button>
          <button class="${waterHistScale==="weeks"?"active":""}" data-scale="weeks">Últimas semanas</button>
          <button class="${waterHistScale==="months"?"active":""}" data-scale="months">Últimos meses</button>
        </div>
        <div class="water-hist" id="rtWaterHist"></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <p class="card-title">Áreas da vida pessoal</p>
      <p style="font-size:12px;color:var(--muted);margin:0 0 14px">Crie quantas áreas fizer sentido — treino, estudo, um curso específico, trabalho... O que você cadastrar aqui aparece sozinho em "Tarefas de hoje".</p>
      <div class="area-pills" id="rtAreaPills"></div>
      <div class="add-row" style="margin-top:10px">
        <input type="text" id="rtAreaIconInp" placeholder="🎓" style="max-width:52px;text-align:center">
        <input type="text" id="rtAreaNameInp" placeholder="Nova área (ex: MBA)">
        <button id="rtAreaAddBtn">＋ Nova área</button>
      </div>
      <div class="icon-suggest" id="rtAreaIconSuggest"></div>

      <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
          <label class="swatch" style="width:24px;height:24px"><input type="color" id="rtAreaColorInp"></label>
          <input type="text" id="rtAreaActiveNameInp" class="row-input" style="font-family:var(--serif);font-size:16px;font-weight:600;flex:0 1 220px">
          <button class="ghost-row-btn" id="rtAreaIconEditBtn">✎ ícone</button>
          <button class="ghost-row-btn" id="rtAreaDelBtn" style="margin-left:auto;color:var(--negative)">🗑 excluir área</button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:0 0 12px">Dia, início/fim, o que fazer — e, se quiser, local/observação e um período de validade (útil pra um curso com data de início e fim, tipo um semestre de MBA).</p>
        <div id="rtRoutineList"></div>
        <div class="add-row">
          <select id="rtRoutineDay">${DOW_FULL.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select>
          <input type="text" id="rtRoutineStart" placeholder="Início hh:mm" style="max-width:90px">
          <input type="text" id="rtRoutineEnd" placeholder="Fim hh:mm" style="max-width:90px">
          <input type="text" id="rtRoutineInp" placeholder="O que fazer">
          <button id="rtRoutineAdd">＋ Adicionar</button>
        </div>
        <div class="add-row">
          <input type="text" id="rtRoutineNote" placeholder="Local / observação (opcional)">
          <label style="font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px">De <input type="date" id="rtRoutineFrom" style="flex:none;width:130px"></label>
          <label style="font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px">até <input type="date" id="rtRoutineTo" style="flex:none;width:130px"></label>
        </div>

        <p style="font-size:12px;color:var(--muted);margin:18px 0 4px">Histórico:</p>
        <div class="segmented" id="rtRoutineHistSeg">
          <button class="${routineHistScale==="days"?"active":""}" data-scale="days">Últimos 7 dias</button>
          <button class="${routineHistScale==="weeks"?"active":""}" data-scale="weeks">Últimas semanas</button>
          <button class="${routineHistScale==="months"?"active":""}" data-scale="months">Últimos meses</button>
        </div>
        <div class="water-hist" id="rtRoutineHist"></div>
        <p style="font-size:11px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px">Últimas sessões</p>
        <div id="rtRoutineLog"></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:4px">
        <p class="card-title" style="margin:0">Dashboard</p>
        <div style="display:flex;gap:8px">
          <button class="ghost-row-btn" id="rtExportCsv">⬇ CSV</button>
          <button class="ghost-row-btn" id="rtExportPdf">⬇ PDF</button>
        </div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin:0 0 12px">O quanto você vem cumprindo — escolha qualquer período, dia a dia.</p>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <span style="font-size:12px;color:var(--muted)">Últimos</span>
        <input type="number" id="rtDashN" min="1" max="365" value="${dashCustomN}" style="width:70px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--paper);color:var(--text)">
        <select id="rtDashUnit" style="border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--paper);color:var(--text)">
          <option value="days" ${dashCustomUnit==="days"?"selected":""}>dia(s)</option>
          <option value="weeks" ${dashCustomUnit==="weeks"?"selected":""}>semana(s)</option>
          <option value="months" ${dashCustomUnit==="months"?"selected":""}>mês(es)</option>
        </select>
        <button class="ghost-row-btn" id="rtDashApply">Aplicar</button>
        <span style="display:flex;gap:6px;flex-wrap:wrap;margin-left:auto">
          ${DASH_QUICK_PICKS.map(q=>`<button class="ghost-row-btn" data-quick="${q.n}|${q.unit}">${q.label}</button>`).join("")}
        </span>
      </div>
      <div class="kpi-grid" style="margin-bottom:16px" id="rtDashKpis"></div>
      <div class="chart-wrap" style="height:220px"><canvas id="rtDashChart"></canvas></div>
      <div class="grid2" style="margin-top:18px;margin-bottom:0">
        <div>
          <p class="card-title" style="font-size:14px">Por hábito</p>
          <div id="rtDashHabits"></div>
        </div>
        <div>
          <p class="card-title" style="font-size:14px">Por área</p>
          <div id="rtDashAreas"></div>
        </div>
      </div>
      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line)">
        <p class="card-title" style="font-size:14px">Comparar hábitos</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <select id="rtCompareA" style="border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--paper);color:var(--text);flex:1;min-width:140px">
            <option value="">Hábito A…</option>
            ${rotina.habits.map(h=>`<option value="${h.id}" ${compareHabitA===h.id?"selected":""}>${esc(h.emoji)} ${esc(h.name)}</option>`).join("")}
          </select>
          <select id="rtCompareB" style="border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--paper);color:var(--text);flex:1;min-width:140px">
            <option value="">Hábito B…</option>
            ${rotina.habits.map(h=>`<option value="${h.id}" ${compareHabitB===h.id?"selected":""}>${esc(h.emoji)} ${esc(h.name)}</option>`).join("")}
          </select>
        </div>
        <div class="chart-wrap" style="height:180px"><canvas id="rtCompareChart"></canvas></div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <p class="card-title">Metas</p>
        <p style="font-size:12px;color:var(--muted);margin:0 0 14px">Vincule a um hábito pra somar sozinha (conta quantas vezes na semana atual você marcou aquele hábito) — passa de 100% se superar a meta.</p>
        <div id="rtGoalList"></div>
        <div class="add-row">
          <input type="text" id="rtGoalInp" placeholder="Ex: Treinar 4x por semana">
          <input type="number" id="rtGoalTargetInp" placeholder="Meta (nº)" style="max-width:100px">
          <select id="rtGoalHabitSel"><option value="">Sem vínculo</option>${rotina.habits.map(h=>`<option value="${h.id}">${esc(h.emoji)} ${esc(h.name)}</option>`).join("")}</select>
          <button id="rtGoalAdd">＋ Nova meta</button>
        </div>
      </div>
      <div class="card">
        <p class="card-title">Mini calendário — ${MONTHS[now.getMonth()]}</p>
        <p style="font-size:12px;color:var(--muted);margin:0 0 14px">Cor = % de hábitos cumpridos naquele dia.</p>
        <div class="cal-grid" id="rtCalGrid"></div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <p class="card-title">Cronômetro</p>
        <p style="font-size:12px;color:var(--muted);margin:0 0 14px">Só cronometra — não grava histórico automaticamente.</p>
        <div class="stopwatch">
          <input type="text" class="sw-label-inp" id="rtSwLabel" placeholder="O que você está fazendo agora? (opcional)">
          <div class="sw-time" id="rtSwTime">${fmtSwTime(swSeconds)}</div>
          <div class="sw-controls">
            <button class="sw-btn ${swRunning?"pause":"start"}" id="rtSwToggle">${swRunning?"Pausar":"Iniciar"}</button>
            <button class="sw-btn reset" id="rtSwReset">Zerar</button>
          </div>
        </div>
      </div>
    </div>
  `;

  wireRotina(c);
}

function wireRotina(c){
  const wide=wrapNames;
  const tToday=tasksToday(), aToday=autoTasksToday();

  // Tarefas (kanban: A fazer / Feito)
  const taskListEl=document.getElementById("rtTaskList");
  const todoRows=[], doneRows=[];
  tToday.forEach(t=>{
    const done = !!(t.done&&t.done[todayStr()]);
    const row = `<div class="task-row">
      <button class="chk ${done?"on":""}" data-tt="${t.id}">${done?"✓":""}</button>
      <div class="task-body">
        <input class="row-input ${wide?"wide":""} ${done?"done-text":""}" data-trn="${t.id}" value="${esc(t.name)}">
        <div class="task-meta">${t.repeatWeekly?`<span class="src-badge repeat">🔁 semanal</span>`:""}<input class="time-input" data-ttime="${t.id}" value="${esc(t.time)}"></div>
      </div>
      <div class="task-actions">
        <button class="icon-btn" data-tup="${t.id}" title="Subir">↑</button>
        <button class="icon-btn" data-tdown="${t.id}" title="Descer">↓</button>
        <button class="icon-btn del" data-tdel="${t.id}">🗑</button>
      </div>
    </div>`;
    (done?doneRows:todoRows).push(row);
  });
  aToday.forEach(a=>{
    const key=todayStr()+"|"+a.areaId+"|"+a.id;
    const done=!!rotina.autoTaskDone[key];
    const row = `<div class="task-row">
      <button class="chk ${done?"on":""}" data-tauto="${a.areaId}|${a.id}">${done?"✓":""}</button>
      <div class="task-body">
        <span class="row-input ${wide?"wide":""} ${done?"done-text":""}" style="padding:2px 0">${esc(a.text)}</span>
        <div class="task-meta"><span class="src-badge" style="background:${a.color}22;color:${a.color}">${esc(a.emoji)} ${esc(a.areaName)}</span><span class="time-input">${esc(a.time)}</span></div>
      </div>
    </div>`;
    (done?doneRows:todoRows).push(row);
  });
  taskListEl.innerHTML = `<div class="kanban">
    <div><div class="kcol-hd"><b>A fazer</b><span class="kcount">${todoRows.length}</span></div>${todoRows.length?todoRows.join(""):`<div class="empty-col">Tudo feito por aqui 🎉</div>`}</div>
    <div><div class="kcol-hd"><b>Feito</b><span class="kcount">${doneRows.length}</span></div>${doneRows.length?doneRows.join(""):`<div class="empty-col">Nada concluído ainda</div>`}</div>
  </div>`;
  taskListEl.querySelectorAll("[data-tt]").forEach(b=>b.onclick=()=>toggleTaskDone(b.dataset.tt));
  taskListEl.querySelectorAll("[data-tauto]").forEach(b=>b.onclick=()=>{ const [k,id]=b.dataset.tauto.split("|"); const item=aToday.find(x=>x.areaId===k&&x.id===id); toggleAutoDone(k,id,item&&item.text,item&&item.time); });
  taskListEl.querySelectorAll("[data-trn]").forEach(i=>i.onchange=()=>renameTask(i.dataset.trn,i.value));
  taskListEl.querySelectorAll("[data-ttime]").forEach(i=>i.onchange=()=>retimeTask(i.dataset.ttime,i.value));
  taskListEl.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>deleteTask(b.dataset.tdel));
  const tTodayIds=tToday.map(t=>t.id);
  taskListEl.querySelectorAll("[data-tup]").forEach(b=>b.onclick=()=>moveTask(b.dataset.tup,-1,tTodayIds));
  taskListEl.querySelectorAll("[data-tdown]").forEach(b=>b.onclick=()=>moveTask(b.dataset.tdown,1,tTodayIds));
  document.getElementById("rtTaskAdd").onclick=()=>{
    const inp=document.getElementById("rtTaskInp"), timeInp=document.getElementById("rtTaskTime"), rep=document.getElementById("rtTaskRepeat");
    if(inp.value.trim()){ addTask(inp.value.trim(), timeInp.value, rep.value==="week"); inp.value=""; timeInp.value=""; rep.value=""; }
  };
  document.getElementById("rtMarkAll").onclick=markAllToday;

  // Hábitos
  const habitListEl=document.getElementById("rtHabitList");
  habitListEl.innerHTML = rotina.habits.length? rotina.habits.map(h=>`
    <div class="hcard">
      <button class="hemoji" data-hicon="${h.id}" title="Trocar ícone">${esc(h.emoji)}</button>
      <div class="hbody">
        <input class="row-input hname-inp ${wide?"wide":""}" data-hrn="${h.id}" value="${esc(h.name)}">
        <div class="hbars">${habitLast7(h).map((d,di)=>{
          const dt=new Date(d.ds+"T00:00:00");
          return `<button class="hbar ${d.on?"on":""} ${di===6?"today":""}" data-hdot="${h.id}|${d.ds}" title="${DOW_FULL[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}${di===6?" (hoje)":""}"></button>`;
        }).join("")}</div>
      </div>
      <span class="hstreak" style="background:${withAlpha(colors.accent2,"1c")};color:${colors.accent2}">${uiIcons.streak}${habitStreak(h)}</span>
      <div class="hactions">
        ${h.hasNotes?`<button class="icon-btn" data-hnote="${h.id}" title="Observação de hoje">📝</button>`:""}
        <button class="icon-btn" data-hexpand="${h.id}" title="Ver histórico completo">${expandedHabitId===h.id?"▾":"▸"}</button>
        <button class="icon-btn" data-hup="${h.id}" title="Subir">↑</button>
        <button class="icon-btn" data-hdown="${h.id}" title="Descer">↓</button>
        <button class="icon-btn del" data-hdel="${h.id}">🗑</button>
      </div>
    </div>
    ${expandedHabitId===h.id?`<div style="padding:0 2px 14px 16px;max-width:100%;overflow:hidden">
      ${habitFullHistory(h).length? habitFullHistory(h).map(d=>{
        const dt=new Date(d.ds+"T00:00:00");
        return `<div class="hist-row">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
            <span class="goal-sub" style="margin:0">${DOW_SHORT[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()} ✓</span>
            <button class="icon-btn del" data-hclearday="${h.id}|${d.ds}" title="Desmarcar este dia">🗑</button>
          </div>
          ${h.hasNotes?`<textarea class="hist-note-inp" data-hnoteedit="${h.id}|${d.ds}" placeholder="Observação desse dia...">${esc(d.note||"")}</textarea>`:(d.note?`<div class="hist-note-view">${esc(d.note)}</div>`:"")}
        </div>`;
      }).join("") : `<p class="empty-hint">Nenhum dia marcado ainda.</p>`}
    </div>`:""}`).join("") : `<p class="empty-hint">Nenhum hábito ainda.</p>`;
  habitListEl.querySelectorAll("[data-hdot]").forEach(b=>b.onclick=()=>{ const [id,ds]=b.dataset.hdot.split("|"); toggleHabitDay(id,ds); });
  habitListEl.querySelectorAll("[data-hrn]").forEach(i=>i.onchange=()=>renameHabit(i.dataset.hrn,i.value));
  habitListEl.querySelectorAll("[data-hdel]").forEach(b=>b.onclick=()=>deleteHabit(b.dataset.hdel));
  habitListEl.querySelectorAll("[data-hicon]").forEach(b=>b.onclick=()=>editHabitIcon(b.dataset.hicon));
  habitListEl.querySelectorAll("[data-hnote]").forEach(b=>b.onclick=()=>editHabitNote(b.dataset.hnote,todayStr()));
  habitListEl.querySelectorAll("[data-hexpand]").forEach(b=>b.onclick=()=>{ expandedHabitId = expandedHabitId===b.dataset.hexpand ? null : b.dataset.hexpand; renderRotina(c); });
  habitListEl.querySelectorAll("[data-hclearday]").forEach(b=>b.onclick=()=>{ const [id,ds]=b.dataset.hclearday.split("|"); toggleHabitDay(id,ds); });
  habitListEl.querySelectorAll("[data-hnoteedit]").forEach(t=>t.onchange=()=>{
    const [id,ds]=t.dataset.hnoteedit.split("|");
    const hh=rotina.habits.find(x=>x.id===id); if(!hh) return;
    hh.notes=hh.notes||{};
    if(t.value.trim()) hh.notes[ds]=t.value.trim(); else delete hh.notes[ds];
    scheduleSave();
  });
  habitListEl.querySelectorAll("[data-hup]").forEach(b=>b.onclick=()=>moveHabit(b.dataset.hup,-1));
  habitListEl.querySelectorAll("[data-hdown]").forEach(b=>b.onclick=()=>moveHabit(b.dataset.hdown,1));
  document.getElementById("rtHabitIconSuggest").innerHTML = HABIT_ICON_SUGGESTIONS.map(e=>`<button type="button" data-picon="${e}">${e}</button>`).join("");
  document.getElementById("rtHabitIconSuggest").querySelectorAll("[data-picon]").forEach(b=>b.onclick=()=>{ document.getElementById("rtHabitIcon").value=b.dataset.picon; });
  document.getElementById("rtHabitAdd").onclick=()=>{
    const inp=document.getElementById("rtHabitInp"), iconInp=document.getElementById("rtHabitIcon"), notesInp=document.getElementById("rtHabitHasNotes");
    if(inp.value.trim()){ addHabit(inp.value.trim(), iconInp.value.trim(), notesInp.checked); inp.value=""; iconInp.value=""; notesInp.checked=false; }
  };

  // Agenda
  document.querySelectorAll("#rtAgendaSeg button").forEach(b=>b.onclick=()=>{ agendaViewMode=b.dataset.mode; renderRotina(c); });
  const agendaListEl=document.getElementById("rtAgendaList");
  if(agendaViewMode==="tomorrow"){
    const d=addDays(new Date(),1), ds=dateStr(d);
    const items=rotina.agenda.filter(a=>a.date===ds).sort((a,b)=>a.time.localeCompare(b.time));
    agendaListEl.innerHTML = items.length? items.map(a=>`
      <div class="agenda-item"><span class="agenda-time">${esc(a.time)}</span><div style="flex:1"><div class="agenda-title">${esc(a.title)}</div><div class="agenda-tag">${esc(a.tag)}</div></div><button class="icon-btn del" data-adel="${a.id}">🗑</button></div>`).join("")
      : `<p class="empty-hint">Nada marcado para amanhã (${DOW_FULL[d.getDay()]}).</p>`;
  } else {
    agendaListEl.innerHTML = agendaNext7Days().map(day=>`
      <div class="agenda-day-hd">${day.label}</div>
      ${day.items.length? day.items.map(a=>`<div class="agenda-item"><span class="agenda-time">${esc(a.time)}</span><div style="flex:1"><div class="agenda-title">${esc(a.title)}</div><div class="agenda-tag">${esc(a.tag)}</div></div><button class="icon-btn del" data-adel="${a.id}">🗑</button></div>`).join("") : `<p class="empty-hint">Nada marcado.</p>`}
    `).join("");
  }
  agendaListEl.querySelectorAll("[data-adel]").forEach(b=>b.onclick=()=>deleteAgendaItem(b.dataset.adel));
  document.getElementById("rtAgendaAdd").onclick=()=>{
    const inp=document.getElementById("rtAgendaInp");
    if(inp.value.trim()){ addAgendaItem(inp.value.trim(), agendaViewMode==="tomorrow"); inp.value=""; }
  };

  // Água
  const circumference=276.5;
  const pct=Math.min(100, Math.round(waterToday()/rotina.waterGoal*100));
  document.getElementById("rtWaterMl").textContent=waterToday();
  document.getElementById("rtWaterGoalTxt").textContent=rotina.waterGoal;
  document.getElementById("rtWaterGoalTxt2").textContent=rotina.waterGoal+"ml";
  document.getElementById("rtWaterPct").textContent=pct+"%";
  document.getElementById("rtWaterArc").setAttribute("stroke-dashoffset", circumference-(circumference*pct/100));
  document.querySelectorAll(".quick-add [data-add]").forEach(b=>b.onclick=()=>addWater(Number(b.dataset.add)));
  document.getElementById("rtWaterOther").onclick=()=>{ const v=prompt("Quantos ml?"); if(v&&!isNaN(v)) addWater(Number(v)); };
  document.getElementById("rtWaterRemove").onclick=()=>{ const v=prompt("Quantos ml remover de hoje?"); if(v&&!isNaN(v)) subtractWater(Number(v)); };
  document.getElementById("rtWaterGoalEdit").onclick=()=>{ const v=prompt("Nova meta diária (ml):", rotina.waterGoal); if(v&&!isNaN(v)) setWaterGoal(Number(v)); };
  document.getElementById("rtWaterEditSave").onclick=()=>{
    const dateInp=document.getElementById("rtWaterEditDate"), valInp=document.getElementById("rtWaterEditVal");
    if(dateInp.value && valInp.value!==""){ setWaterForDate(dateInp.value, Number(valInp.value)); dateInp.value=""; valInp.value=""; }
  };
  function markClass(p){ return p>=100?"ok":p>=70?"warn":"no"; }
  document.querySelectorAll("#rtWaterHistSeg button").forEach(b=>b.onclick=()=>{ waterHistScale=b.dataset.scale; renderRotina(c); });
  const whEl=document.getElementById("rtWaterHist");
  if(waterHistScale==="days"){
    whEl.innerHTML = waterLast7().map(h=>{ const p=Math.round(h.ml/rotina.waterGoal*100); return `<div class="wh-item"><div class="wh-day">${h.label}</div><div class="wh-mark ${markClass(p)}">${p>=100?"✓":p+"%"}</div></div>`; }).join("");
  } else {
    const wdata = waterHistScale==="weeks" ? waterWeeks(6) : waterMonths(6);
    whEl.innerHTML = wdata.map(d=>`<div class="wh-item"><div class="wh-day">${d.label}</div><div class="wh-mark ${markClass(d.pct)}">${d.pct}%</div></div>`).join("");
  }

  // Áreas da vida pessoal
  if(!activeAreaId || !rotina.areas.find(a=>a.id===activeAreaId)) activeAreaId = rotina.areas[0] && rotina.areas[0].id;
  const areaPillsEl=document.getElementById("rtAreaPills");
  areaPillsEl.innerHTML = rotina.areas.map(a=>`<button class="subtab ${a.id===activeAreaId?"active":""}" data-area="${a.id}" style="${a.id===activeAreaId?`background:${a.color};border-color:${a.color}`:""}">${esc(a.emoji)} ${esc(a.name)}</button>`).join("");
  areaPillsEl.querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>{ activeAreaId=b.dataset.area; renderRotina(c); });
  document.getElementById("rtAreaIconSuggest").innerHTML = HABIT_ICON_SUGGESTIONS.map(e=>`<button type="button" data-apicon="${e}">${e}</button>`).join("");
  document.getElementById("rtAreaIconSuggest").querySelectorAll("[data-apicon]").forEach(b=>b.onclick=()=>{ document.getElementById("rtAreaIconInp").value=b.dataset.apicon; });
  document.getElementById("rtAreaAddBtn").onclick=()=>{
    const nameInp=document.getElementById("rtAreaNameInp"), iconInp=document.getElementById("rtAreaIconInp");
    if(nameInp.value.trim()){ activeAreaId=addArea(iconInp.value.trim(), nameInp.value.trim()); nameInp.value=""; iconInp.value=""; }
  };

  const activeArea = rotina.areas.find(a=>a.id===activeAreaId);
  if(activeArea){
    document.getElementById("rtAreaColorInp").value=activeArea.color;
    document.getElementById("rtAreaColorInp").oninput=e=>setAreaColor(activeArea.id,e.target.value);
    document.getElementById("rtAreaActiveNameInp").value=activeArea.name;
    document.getElementById("rtAreaActiveNameInp").onchange=e=>renameArea(activeArea.id,e.target.value);
    document.getElementById("rtAreaIconEditBtn").onclick=()=>{ const v=prompt("Novo ícone (emoji):",activeArea.emoji); if(v&&v.trim()) setAreaEmoji(activeArea.id,v.trim().slice(0,4)); };
    document.getElementById("rtAreaDelBtn").onclick=()=>{ deleteArea(activeArea.id); activeAreaId=null; };

    const routineListEl=document.getElementById("rtRoutineList");
    const items = rotina.routineItems.filter(r=>r.areaId===activeArea.id);
    const sorted=[...items].sort((a,b)=> a.weekday-b.weekday || a.time.localeCompare(b.time));
    routineListEl.innerHTML = sorted.length? sorted.map(r=>`
      <div class="routine-row">
        <span class="routine-day">${DOW_SHORT[r.weekday]}</span>
        <span class="time-input" style="width:78px">${esc(r.time)}${r.end?"–"+esc(r.end):""}</span>
        <input class="routine-input ${wide?"wide":""}" data-rtxt="${r.id}" value="${esc(r.text)}">
        ${r.note?`<span class="src-badge" style="background:var(--line);color:var(--muted)">${esc(r.note)}</span>`:""}
        ${r.to?`<span class="src-badge" style="background:#B8963E22;color:var(--accent2)">até ${esc(r.to.split("-").reverse().join("/"))}</span>`:""}
        <button class="icon-btn del" data-rdel="${r.id}">🗑</button>
      </div>`).join("") : `<p class="empty-hint">Nada cadastrado em "${esc(activeArea.name)}" ainda.</p>`;
    routineListEl.querySelectorAll("[data-rtxt]").forEach(i=>i.onchange=()=>editRoutineItem(i.dataset.rtxt,"text",i.value));
    routineListEl.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=()=>deleteRoutineItem(b.dataset.rdel));
    document.getElementById("rtRoutineAdd").onclick=()=>{
      const day=document.getElementById("rtRoutineDay").value;
      const start=document.getElementById("rtRoutineStart").value||"--:--";
      const end=document.getElementById("rtRoutineEnd").value||"";
      const textInp=document.getElementById("rtRoutineInp");
      const note=document.getElementById("rtRoutineNote").value;
      const from=document.getElementById("rtRoutineFrom").value;
      const to=document.getElementById("rtRoutineTo").value;
      if(textInp.value.trim()){
        addRoutineItem(activeArea.id, day, start, end, textInp.value.trim(), note, from, to);
        ["rtRoutineStart","rtRoutineEnd","rtRoutineNote","rtRoutineFrom","rtRoutineTo"].forEach(id=>document.getElementById(id).value="");
        textInp.value="";
      }
    };

    document.querySelectorAll("#rtRoutineHistSeg button").forEach(b=>b.onclick=()=>{ routineHistScale=b.dataset.scale; renderRotina(c); });
    const rHistEl=document.getElementById("rtRoutineHist");
    let rHistData;
    if(routineHistScale==="days") rHistData=routineDaysHist(activeArea.id);
    else if(routineHistScale==="weeks") rHistData=routineWeeksHist(activeArea.id,6);
    else rHistData=routineMonthsHist(activeArea.id,6);
    rHistEl.innerHTML = rHistData.map(d=>{
      const cls = d.pct===null?"":markClass(d.pct);
      return `<div class="wh-item"><div class="wh-day">${d.label}</div><div class="wh-mark ${cls}" style="${d.pct===null?"background:var(--line);color:var(--muted)":""}">${d.pct===null?"—":(d.pct>=100?"✓":d.pct+"%")}</div></div>`;
    }).join("");
    const rLogEl=document.getElementById("rtRoutineLog");
    const logItems=routineLog(activeArea.id,10);
    rLogEl.innerHTML = logItems.length? logItems.map(l=>{
      const dt=new Date(l.date+"T00:00:00");
      return `<div class="agenda-item"><span class="agenda-time">${esc(l.time||"")}</span><div style="flex:1"><div class="agenda-title">${esc(l.text||"")}</div><div class="agenda-tag">${DOW_SHORT[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}</div></div></div>`;
    }).join("") : `<p class="empty-hint">Nenhuma sessão registrada ainda.</p>`;
  }

  // Metas
  const goalListEl=document.getElementById("rtGoalList");
  goalListEl.innerHTML = rotina.goals.length? rotina.goals.map(g=>{
    const linkedHabit = g.linkedHabitId ? rotina.habits.find(h=>h.id===g.linkedHabitId) : null;
    const current = linkedHabit ? habitCountThisWeek(linkedHabit.id) : g.current;
    const p = g.target? Math.round(current/g.target*100) : 0;
    const barW = Math.min(100,p);
    return `<div class="goal-item">
      <div class="goal-item-hd"><span>${esc(g.name)}</span><div style="display:flex;gap:6px">${linkedHabit?`<button class="icon-btn" data-gexpand="${g.id}" title="Histórico semanal">📊</button>`:""}<button class="icon-btn del" data-gdel="${g.id}">🗑</button></div></div>
      <div class="bar-track"><div class="bar-fill" style="width:${barW}%"></div></div>
      <div class="goal-sub">
        ${linkedHabit?`<span>🔗 vinculada a ${esc(linkedHabit.emoji)} ${esc(linkedHabit.name)} — <button class="icon-btn" data-gunlink="${g.id}" style="padding:0;text-decoration:underline;color:var(--muted)">desvincular</button></span>`
          :`<button class="icon-btn" data-gminus="${g.id}" style="padding:0 4px">−</button>`}
        ${!linkedHabit?` ${current} de `:` · `}${!linkedHabit?`<button class="icon-btn" data-gtarget="${g.id}" style="padding:0;text-decoration:underline;color:var(--muted)">${g.target}</button>`:`${current} de ${g.target}`}${!linkedHabit?` <button class="icon-btn" data-gplus="${g.id}" style="padding:0 4px">＋</button>`:""} (${p}%)
      </div>
      ${expandedGoalId===g.id && linkedHabit? `<div class="water-hist" style="margin-top:8px">${goalWeeklyHistory(g,6).map(w=>`<div class="wh-item"><div class="wh-day">${w.label}</div><div class="wh-mark ${w.pct>=100?"ok":w.pct>=50?"warn":"no"}">${w.count}/${g.target}</div></div>`).join("")}</div>` : ""}
    </div>`;
  }).join("") : `<p class="empty-hint">Nenhuma meta ainda.</p>`;
  goalListEl.querySelectorAll("[data-gdel]").forEach(b=>b.onclick=()=>deleteRotinaGoal(b.dataset.gdel));
  goalListEl.querySelectorAll("[data-gplus]").forEach(b=>b.onclick=()=>bumpRotinaGoal(b.dataset.gplus,1));
  goalListEl.querySelectorAll("[data-gminus]").forEach(b=>b.onclick=()=>bumpRotinaGoal(b.dataset.gminus,-1));
  goalListEl.querySelectorAll("[data-gtarget]").forEach(b=>b.onclick=()=>editRotinaGoalTarget(b.dataset.gtarget));
  goalListEl.querySelectorAll("[data-gunlink]").forEach(b=>b.onclick=()=>unlinkRotinaGoal(b.dataset.gunlink));
  goalListEl.querySelectorAll("[data-gexpand]").forEach(b=>b.onclick=()=>{ expandedGoalId = expandedGoalId===b.dataset.gexpand ? null : b.dataset.gexpand; renderRotina(c); });
  document.getElementById("rtGoalAdd").onclick=()=>{
    const inp=document.getElementById("rtGoalInp"), targetInp=document.getElementById("rtGoalTargetInp"), habitSel=document.getElementById("rtGoalHabitSel");
    if(inp.value.trim()){ addRotinaGoal(inp.value.trim(), Number(targetInp.value)||4, habitSel.value||null); inp.value=""; targetInp.value=""; habitSel.value=""; }
  };

  // Dashboard
  document.getElementById("rtDashApply").onclick=()=>{
    dashCustomN=Math.max(1,Number(document.getElementById("rtDashN").value)||1);
    dashCustomUnit=document.getElementById("rtDashUnit").value;
    renderRotina(c);
  };
  document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{
    const [n,unit]=b.dataset.quick.split("|"); dashCustomN=Number(n); dashCustomUnit=unit; renderRotina(c);
  });
  document.getElementById("rtExportCsv").onclick=exportRotinaCSV;
  document.getElementById("rtExportPdf").onclick=exportRotinaPDF;
  const dashDays=unitToDays(dashCustomN,dashCustomUnit);
  const stats=dashboardStats(dashDays);
  document.getElementById("rtDashKpis").innerHTML = `
    <div class="kpi"><div class="kpi-lbl">Hábitos</div><div class="kpi-val" style="color:var(--positive)">${stats.habitPct===null?"—":stats.habitPct+"%"}</div></div>
    <div class="kpi"><div class="kpi-lbl">Água (dias na meta)</div><div class="kpi-val" style="color:var(--accent2)">${stats.waterPct}%</div></div>
    <div class="kpi"><div class="kpi-lbl">Tarefas recorrentes</div><div class="kpi-val">${stats.taskPct===null?"—":stats.taskPct+"%"}</div></div>
  `;
  document.getElementById("rtDashHabits").innerHTML = stats.perHabit.length? stats.perHabit.map(h=>`
    <div class="goal-sub" style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(h.emoji)} ${esc(h.name)}</span><strong>${h.pct}%</strong></div>`).join("") : `<p class="empty-hint">Nenhum hábito ainda.</p>`;
  document.getElementById("rtDashAreas").innerHTML = stats.perArea.length? stats.perArea.map(a=>`
    <div class="goal-sub" style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(a.emoji)} ${esc(a.name)}</span><strong>${a.pct===null?"—":a.pct+"%"}</strong></div>`).join("") : `<p class="empty-hint">Nenhuma área ainda.</p>`;
  const trend=dashboardTrend(dashDays);
  if(chartRotinaDash) chartRotinaDash.destroy();
  const t=theme();
  chartRotinaDash=new Chart(document.getElementById("rtDashChart"),{
    type:"line",
    data:{labels:trend.map(b=>b.label), datasets:[
      {label:"Hábitos %",data:trend.map(b=>b.habitPct),borderColor:t.positive,tension:.3},
      {label:"Água na meta %",data:trend.map(b=>b.waterPct),borderColor:t.accent2,tension:.3},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:t.text}}},scales:{x:{ticks:{color:t.muted,maxRotation:0,autoSkip:true}},y:{min:0,max:100,ticks:{color:t.muted}}}}
  });

  // Comparar hábitos
  document.getElementById("rtCompareA").onchange=e=>{ compareHabitA=e.target.value||null; renderRotina(c); };
  document.getElementById("rtCompareB").onchange=e=>{ compareHabitB=e.target.value||null; renderRotina(c); };
  if(chartRotinaCompare) chartRotinaCompare.destroy();
  const trendA = compareHabitA? habitTrend(compareHabitA,dashDays) : [];
  const trendB = compareHabitB? habitTrend(compareHabitB,dashDays) : [];
  const compareLabels = trendA.length? trendA.map(b=>b.label) : trendB.map(b=>b.label);
  chartRotinaCompare=new Chart(document.getElementById("rtCompareChart"),{
    type:"line",
    data:{labels:compareLabels, datasets:[
      ...(compareHabitA?[{label:rotina.habits.find(h=>h.id===compareHabitA)?.name||"A",data:trendA.map(b=>b.pct),borderColor:t.positive,tension:.3}]:[]),
      ...(compareHabitB?[{label:rotina.habits.find(h=>h.id===compareHabitB)?.name||"B",data:trendB.map(b=>b.pct),borderColor:t.negative,tension:.3}]:[]),
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:t.text}}},scales:{x:{ticks:{color:t.muted,maxRotation:0,autoSkip:true}},y:{min:0,max:100,ticks:{color:t.muted}}}}
  });

  // Mini calendário
  const now=new Date();
  const y=now.getFullYear(), mo=now.getMonth();
  const daysInMonth=new Date(y,mo+1,0).getDate();
  const startOffset=new Date(y,mo,1).getDay();
  let calHtml = DOW_SHORT.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  for(let i=0;i<startOffset;i++) calHtml += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds=dateStr(new Date(y,mo,d));
    const pctc=dayHabitPct(ds);
    const color = pctc===null? "var(--line)" : pctc>=80?"var(--positive)":pctc>=40?"var(--accent2)":pctc>0?"var(--negative)":"var(--line)";
    calHtml += `<div class="cal-day ${d===now.getDate()?"today":""}">${d}<span class="cal-dot" style="background:${color}"></span></div>`;
  }
  document.getElementById("rtCalGrid").innerHTML = calHtml;

  // Cronômetro
  document.getElementById("rtSwToggle").onclick = e=>{
    swRunning=!swRunning;
    if(swRunning){ swInterval=setInterval(()=>{ swSeconds++; const t=document.getElementById("rtSwTime"); if(t) t.textContent=fmtSwTime(swSeconds); },1000); }
    else clearInterval(swInterval);
    e.target.textContent = swRunning?"Pausar":"Iniciar";
    e.target.className = "sw-btn "+(swRunning?"pause":"start");
  };
  document.getElementById("rtSwReset").onclick = ()=>{
    swRunning=false; clearInterval(swInterval); swSeconds=0;
    document.getElementById("rtSwTime").textContent="00:00";
    const btn=document.getElementById("rtSwToggle"); btn.textContent="Iniciar"; btn.className="sw-btn start";
  };
}

// ───────── RENDER: DISPATCH ─────────
function renderAll(){
  if(!loaded) return;
  const content=document.getElementById("content");
  if(appSection==="rotina"){ renderRotina(content); return; }
  if(tab==="dashboard") renderDashboard(content);
  else if(tab==="faturamento") renderFaturamento(content);
  else if(tab==="despesas") renderDespesas(content);
  else if(tab==="patrimonio") renderPatrimonio(content);
  else if(tab==="devedores") renderDevedores(content);
  else if(tab==="comparar") renderComparar(content);
  else if(tab==="combinada") renderCombinada(content);
}
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
